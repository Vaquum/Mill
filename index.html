<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>time_bars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --c-near-black: #121212;
    --c-warm-black: #231F20;
    --c-dark-gray:  #444444;
    --c-mid-gray:   #808080;
    --c-light-gray: #D3D3D3;
    --c-pale-gray:  #F3F3F3;
    --c-off-white:  #F8F8F8;
    --c-cyan:       #C4E8F4;
    --c-pale-pink:  #FCE2EB;
    --c-pink:       #EAA3C8;
    --c-magenta:    #DC65A6;
    --c-coral:      #F16068;
    --c-lavender:   #BCABD3;
    --c-yellow:     #DDD941;

    --bg:            var(--c-near-black);
    --bg-1:          var(--c-warm-black);
    --panel:         var(--c-warm-black);
    --border:        var(--c-dark-gray);
    --border-strong: var(--c-mid-gray);
    --fg:            var(--c-off-white);
    --fg-1:          var(--c-pale-gray);
    --fg-2:          var(--c-light-gray);
    --fg-3:          var(--c-mid-gray);
    --pos:           var(--c-cyan);
    --neg:           var(--c-coral);
    --accent:        var(--c-yellow);
    --active:        var(--c-cyan);
    --hot:           var(--c-magenta);

    --font-sans: "IBM Plex Sans", sans-serif;
    --font-mono: "IBM Plex Mono", monospace;

    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 24px;
    --s-6: 32px;

    --t-xs: 11px;
    --t-base: 12.5px;
    --t-md: 13px;

    --row-h: 36px;
    --col-dt: 184px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: var(--bg); color: var(--fg);
    font: 400 13px/1.4 var(--font-sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  header {
    flex: 0 0 auto;
    padding: var(--s-4) var(--s-5);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg);
  }
  header .left { display: flex; align-items: center; gap: var(--s-6); }
  header .right { display: flex; align-items: center; gap: var(--s-5); }
  .control-group { display: flex; align-items: center; gap: var(--s-4); }
  .button-group { display: flex; align-items: center; gap: var(--s-4); }
  .date-filter {
    display: inline-flex;
    align-items: center;
    gap: var(--s-2);
  }
  .date-filter .sep { color: var(--fg-3); }
  .date-filter input[type="date"] {
    appearance: none; -webkit-appearance: none;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 2px;
    height: 28px;
    padding: 0 var(--s-2);
    font: 400 var(--t-base) var(--font-mono);
    font-variant-numeric: tabular-nums;
    line-height: 1;
    cursor: pointer;
    color-scheme: dark;
    transition: border-color 80ms ease;
    display: inline-flex;
    align-items: center;
  }
  .date-filter input[type="date"]:hover { border-color: var(--border-strong); }
  .date-filter input[type="date"]:focus-visible { outline: none; border-color: var(--fg-2); }
  .date-filter input[type="date"]::-webkit-calendar-picker-indicator {
    cursor: pointer;
    padding: 0;
    margin: 0 0 0 var(--s-1);
    align-self: center;
  }
  .date-filter input[type="date"]::-webkit-datetime-edit { padding: 0; line-height: 1; }
  .date-filter input[type="date"]::-webkit-datetime-edit-fields-wrapper { padding: 0; }
  .date-presets {
    display: inline-flex;
    align-items: center;
    gap: var(--s-3);
    margin-left: var(--s-2);
  }
  .date-presets a {
    cursor: pointer;
    color: var(--fg-2);
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    user-select: none;
    transition: color 80ms ease;
  }
  .date-presets a:hover { color: var(--fg); }
  .date-presets a.active { color: var(--accent); }
  .meta {
    color: var(--fg-2);
    font: 400 var(--t-base) var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .meta b { color: var(--fg); font-weight: 500; }

  .control {
    display: inline-flex; align-items: center; gap: var(--s-3);
    color: var(--fg-2);
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .control select {
    appearance: none; -webkit-appearance: none;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 2px;
    height: 28px;
    padding: 0 var(--s-5) 0 var(--s-3);
    line-height: 1;
    font: 400 var(--t-md) var(--font-sans);
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path fill='%23808080' d='M2 4l3 3 3-3z'/></svg>");
    background-repeat: no-repeat;
    background-position: right var(--s-2) center;
    transition: border-color 80ms ease, color 80ms ease;
  }
  .control select:hover { border-color: var(--border-strong); }
  .control select:focus-visible { outline: none; border-color: var(--fg-2); }
  .control select option { background: var(--panel); color: var(--fg); }
  .control select option:disabled { color: var(--fg-3); }

  .button {
    appearance: none; -webkit-appearance: none;
    background: transparent;
    color: var(--fg-2);
    border: none;
    padding: 0;
    height: 28px;
    display: inline-flex;
    align-items: center;
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 80ms ease;
  }
  .button:hover { color: var(--fg); }
  .button:focus-visible { outline: none; color: var(--fg); }
  .button.toggle.active { color: var(--accent); }
  .button.toggle.active:hover { color: var(--accent); }

  .content {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .modal {
    position: absolute; inset: 0;
    background: var(--bg);
    display: none;
    align-items: stretch; justify-content: stretch;
    z-index: 10;
  }
  .modal.open { display: flex; }
  .modal-panel {
    flex: 1 1 auto;
    margin: var(--s-6);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    flex: 0 0 auto;
    padding: var(--s-4) var(--s-5);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    color: var(--fg-2);
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .modal-head .actions { display: inline-flex; align-items: center; gap: var(--s-1); }
  .modal-head .icon-button {
    background: transparent; border: none; color: var(--fg-2);
    cursor: pointer; padding: var(--s-1) var(--s-2); line-height: 0;
    border-radius: 2px;
    transition: color 80ms ease, background 80ms ease;
  }
  .modal-head .icon-button:hover { color: var(--fg); background: var(--bg); }
  .modal-head .icon-button.copied { color: var(--accent); }
  .modal-head .icon-button.active { color: var(--accent); }
  .modal-head .icon-button svg { display: block; }
  .modal-head .close {
    background: transparent; border: none; color: var(--fg-2);
    font-size: 20px; line-height: 1; cursor: pointer;
    padding: var(--s-1) var(--s-2);
    transition: color 80ms ease;
  }
  .modal-head .close:hover { color: var(--fg); }
  .modal-body {
    flex: 1 1 auto;
    overflow: auto;
    padding: 0;
    background: var(--panel);
  }
  .qc-table {
    border-collapse: collapse;
    width: 100%;
    font: 400 var(--t-base) var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .qc-table thead th {
    position: sticky; top: 0;
    background: var(--panel);
    color: var(--fg-2);
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: right;
    padding: var(--s-3) var(--s-4);
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: nowrap;
  }
  .qc-table thead th:first-child { text-align: left; padding-left: var(--s-5); }
  .qc-table thead th:last-child { border-right: none; }
  .qc-table tbody td {
    padding: var(--s-2) var(--s-4);
    text-align: right;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .qc-table tbody td:first-child {
    text-align: left; padding-left: var(--s-5);
    color: var(--fg-2);
    font: 400 var(--t-md) var(--font-sans);
  }
  .qc-table tbody td:last-child { border-right: none; }
  .qc-table tbody tr:hover td { background: var(--bg); }
  .qc-table .num.pos { color: var(--pos); }
  .qc-table .num.neg { color: var(--neg); }
  .qc-table .num.null { color: var(--fg-3); }
  .qc-status {
    padding: var(--s-6) var(--s-5);
    color: var(--fg-2);
    font: 400 var(--t-md) var(--font-sans);
  }
  .qc-table {
    --metric-w: 240px;
    --feature-w: 132px;
    table-layout: fixed;
  }
  .qc-table thead th:nth-child(1),
  .qc-table tbody td:nth-child(1) {
    position: sticky;
    left: 0;
    background: var(--panel);
    width: var(--metric-w);
    min-width: var(--metric-w);
  }
  .qc-table thead th:nth-child(n+2),
  .qc-table tbody td:nth-child(n+2) {
    width: var(--feature-w);
    min-width: var(--feature-w);
    max-width: var(--feature-w);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .qc-table thead th:nth-child(1) { z-index: 3; }
  .qc-table thead th { z-index: 2; }
  .qc-table tbody td:nth-child(1) { z-index: 1; }
  .qc-table tbody tr:hover td:nth-child(1) { background: var(--bg); }
  .qc-table.with-grades tbody td[data-grade] { position: relative; }
  .qc-table.with-grades tbody td[data-grade]::before {
    content: attr(data-grade);
    position: absolute;
    left: var(--s-3);
    top: 50%;
    transform: translateY(-50%);
    font: 500 var(--t-xs) var(--font-sans);
    color: var(--fg-3);
    pointer-events: none;
  }
  .qc-table.with-grades tbody td[data-grade="D"]::before { color: var(--neg); }
  .qc-table.with-grades tbody td[data-grade="C"]::before { color: var(--accent); }
  .qc-table.with-grades tbody td[data-grade="S"]::before { color: var(--pos); }
  .qc-table tbody tr.qc-group-row { cursor: pointer; user-select: none; }
  .qc-table tbody tr.qc-group-row td {
    color: var(--fg);
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--bg);
  }
  .qc-table tbody tr.qc-group-row:hover td { background: var(--bg); }
  .qc-table tbody tr.qc-group-row td:first-child .chevron {
    display: inline-block;
    width: 10px;
    color: var(--fg-3);
    margin-right: var(--s-2);
    transition: color 80ms ease;
  }
  .qc-table tbody tr.qc-group-row:hover td:first-child .chevron { color: var(--fg); }
  .qc-table.with-grades tbody tr.qc-group-row td[data-grade] { position: relative; }
  .qc-table.with-grades tbody tr.qc-group-row td[data-grade]::before {
    content: attr(data-grade);
    position: absolute;
    left: var(--s-3);
    top: 50%;
    transform: translateY(-50%);
    font: 500 var(--t-xs) var(--font-sans);
    color: var(--fg-3);
    pointer-events: none;
  }
  .qc-table.with-grades tbody tr.qc-group-row td[data-grade="D"]::before { color: var(--neg); }
  .qc-table.with-grades tbody tr.qc-group-row td[data-grade="C"]::before { color: var(--accent); }
  .qc-table.with-grades tbody tr.qc-group-row td[data-grade="S"]::before { color: var(--pos); }
  .qc-table.with-grades tbody td[data-grade="NA"]::before { color: var(--fg-3); letter-spacing: 0.04em; }
  .qc-table tbody td.has-tip { cursor: help; }
  .qc-tip {
    position: fixed;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    border-radius: 2px;
    padding: var(--s-3) var(--s-4);
    font: 400 var(--t-md) var(--font-sans);
    line-height: 1.5;
    max-width: 360px;
    z-index: 100;
    pointer-events: none;
    display: none;
  }
  .qc-tip.open { display: block; }

  .row-groups {
    padding: var(--s-5);
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: var(--s-6);
  }
  .row-group-header {
    color: var(--fg-2);
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: var(--s-3);
    padding-bottom: var(--s-2);
    border-bottom: 1px solid var(--border);
  }
  .row-options { display: flex; flex-direction: column; gap: var(--s-1); }
  .row-option {
    display: flex; align-items: center; gap: var(--s-3);
    cursor: pointer; user-select: none;
    padding: var(--s-1) 0;
    font: 400 var(--t-md) var(--font-sans);
    color: var(--fg);
  }
  .row-option input[type="radio"] {
    appearance: none; -webkit-appearance: none;
    width: 14px; height: 14px;
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    position: relative;
    flex: 0 0 auto;
    transition: border-color 80ms ease, background 80ms ease;
  }
  .row-option input[type="radio"]:hover { border-color: var(--fg-2); }
  .row-option input[type="radio"]:checked { background: var(--accent); border-color: var(--accent); }
  .row-option input[type="radio"]:checked::after {
    content: '';
    position: absolute;
    width: 6px; height: 6px;
    background: var(--bg);
    border-radius: 50%;
    left: 3px; top: 3px;
  }
  .row-option-input {
    appearance: textfield;
    margin-left: var(--s-2);
    width: 56px;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: var(--s-1) var(--s-2);
    font: 400 var(--t-base) var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  .row-option-input::-webkit-outer-spin-button,
  .row-option-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .row-option-input:focus-visible { outline: none; border-color: var(--accent); }
  .row-option-disabled { color: var(--fg-3); cursor: not-allowed; }
  .row-option-disabled input { cursor: not-allowed; opacity: 0.5; }

  .features-builder {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100%;
  }
  .features-pane {
    overflow: auto;
    padding: var(--s-5);
    display: flex; flex-direction: column;
  }
  .features-pane.palette { border-right: 1px solid var(--border); }
  .features-pane-header {
    color: var(--fg-2);
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: var(--s-3);
    padding-bottom: var(--s-2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--panel); z-index: 1;
  }
  .palette-items {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: var(--s-2);
  }
  .palette-item {
    display: inline-flex; align-items: center; gap: var(--s-2);
    padding: var(--s-1) var(--s-3);
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: grab;
    font: 400 var(--t-base) var(--font-mono);
    color: var(--fg);
    user-select: none;
    flex: 0 0 auto;
    transition: border-color 80ms ease, background 80ms ease, color 80ms ease;
  }
  .palette-item:hover { border-color: var(--border-strong); background: var(--bg); color: var(--accent); }
  .palette-item:active { cursor: grabbing; }
  .palette-search {
    position: sticky;
    top: 0;
    z-index: 2;
    width: 100%;
    box-sizing: border-box;
    padding: var(--s-1) var(--s-3);
    margin-bottom: var(--s-3);
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--panel);
    color: var(--fg);
    font: 400 var(--t-base) var(--font-mono);
    outline: none;
  }
  .palette-search::placeholder {
    color: var(--fg-2);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font: 500 var(--t-xs) var(--font-sans);
  }
  .palette-search:focus { border-color: var(--accent); }
  .features-active {
    position: relative;
    transition: background 80ms ease;
  }
  .features-active.dragover {
    outline: 2px dashed var(--accent);
    outline-offset: calc(var(--s-2) * -1);
  }
  .active-empty {
    color: var(--fg-3);
    font: 400 var(--t-md) var(--font-sans);
    padding: var(--s-6) 0;
    text-align: center;
  }
  .active-chip {
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--bg);
    transition: border-color 80ms ease, opacity 80ms ease;
  }
  .active-chip:hover { border-color: var(--border-strong); }
  .active-chip.open { border-color: var(--accent); }
  .active-chip.dragging { opacity: 0.4; }
  .active-chip.drop-target { border-color: var(--accent); border-style: dashed; }
  .active-chip-head {
    display: flex; align-items: center; gap: var(--s-3);
    padding: var(--s-3);
    cursor: grab;
    user-select: none;
    font: 400 var(--t-base) var(--font-mono);
  }
  .active-chip.dragging .active-chip-head { cursor: grabbing; }
  .active-chip-name { color: var(--fg); }
  .active-chip-summary {
    color: var(--fg-2);
    font: 400 var(--t-base) var(--font-mono);
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  .active-chip-remove {
    background: transparent; border: none; color: var(--fg-3);
    cursor: pointer;
    font-size: 18px; line-height: 1;
    padding: 0 var(--s-1);
    transition: color 80ms ease;
  }
  .active-chip-remove:hover { color: var(--neg); }
  .active-chip-params {
    display: none;
    flex-direction: column;
    border-top: 1px solid var(--border);
    padding: var(--s-3);
    gap: var(--s-2);
  }
  .active-chip.open .active-chip-params { display: flex; }
  .chip-tags {
    display: flex;
    align-items: center;
    gap: var(--s-2);
  }
  .active-chip-params > .chip-tags:not(:first-child) {
    margin-top: var(--s-2);
    padding-top: var(--s-2);
    border-top: 1px dashed var(--border);
  }
  .chip-tags-label {
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
    flex: 0 0 auto;
  }
  .chip-tags-input {
    flex: 1 1 auto;
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: var(--s-1) var(--s-2);
    font: 400 var(--t-base) var(--font-mono);
  }
  .chip-tags-input::placeholder { color: var(--fg-3); }
  .chip-tags-input:focus-visible { outline: none; border-color: var(--accent); }
  .paramset-row {
    display: flex;
    align-items: center;
    gap: var(--s-3);
  }
  .paramset-row .param-row { flex: 0 0 auto; }
  .paramset-row .spacer { flex: 1 1 auto; }
  .paramset-remove,
  .paramset-add {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-2);
    border-radius: 2px;
    height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font: 400 var(--t-md) var(--font-mono);
    transition: border-color 80ms ease, color 80ms ease;
    flex: 0 0 auto;
  }
  .paramset-remove { width: 24px; padding: 0; }
  .paramset-remove:hover { color: var(--neg); border-color: var(--neg); }
  .paramset-add {
    height: 28px;
    padding: 0 var(--s-3);
    align-self: flex-start;
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: var(--s-1);
  }
  .paramset-add:hover { color: var(--accent); border-color: var(--accent); }
  .param-row {
    display: inline-flex; align-items: center; gap: var(--s-2);
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-2);
  }
  .param-row input {
    background: transparent;
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: var(--s-1) var(--s-2);
    font: 400 var(--t-base) var(--font-mono);
    width: 64px;
    appearance: textfield;
    font-variant-numeric: tabular-nums;
    text-transform: none;
    letter-spacing: 0;
  }
  .param-row input::-webkit-outer-spin-button,
  .param-row input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .param-row input:focus-visible { outline: none; border-color: var(--accent); }

  .table { flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; }

  .head, .row {
    display: grid;
    grid-template-columns: var(--col-dt) repeat(var(--cols), minmax(0, 1fr));
  }
  .head {
    flex: 0 0 auto;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; position: relative; }
  .scroller { position: relative; width: 100%; }

  .row {
    position: absolute; left: 0; right: 0;
    height: var(--row-h);
    border-bottom: 1px solid var(--panel);
  }
  .row:hover { background: var(--panel); }

  .cell {
    padding: 0 var(--s-4);
    height: var(--row-h);
    display: flex; align-items: center; justify-content: flex-end;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font: 400 var(--t-base) var(--font-mono);
    font-variant-numeric: tabular-nums;
    position: relative;
    transition: background 80ms ease;
  }
  .cell:first-child {
    justify-content: flex-start;
    padding-left: var(--s-5);
    color: var(--fg-2);
  }
  .cell.col-hover { background: var(--panel); }
  .body.bars-on .cell.has-bar {
    background: linear-gradient(
      to right,
      var(--border) 0,
      var(--border) var(--bar-pct, 0%),
      transparent var(--bar-pct, 0%)
    );
  }
  .cell.binary-on {
    justify-content: center;
    color: var(--fg-2);
  }

  .head .cell {
    color: var(--fg-2);
    font: 500 var(--t-xs) var(--font-sans);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    gap: var(--s-2);
    transition: color 80ms ease;
  }
  .head .cell:hover { color: var(--fg-1); }
  .head .cell.active { color: var(--active); }
  .head .caret {
    display: inline-block;
    width: 8px;
    height: var(--t-xs);
    line-height: var(--t-xs);
    font-size: var(--t-xs);
    color: var(--fg-2);
    text-align: center;
    flex: 0 0 auto;
  }
  .head .cell.active .caret { color: var(--active); }

  .row .cell.pos { color: var(--pos); }
  .row .cell.neg { color: var(--neg); }
  .row .cell.null { color: var(--fg-3); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="left">
      <div class="control-group">

          <span>bars</span>

        </label>
        <label class="control">

        </label>

          <select id="target-select"></select>
        </label>
      </div>
      <div class="button-group">
        <button class="button toggle" id="norm-button" type="button">NORM</button>
        <button class="button toggle" id="bar-button" type="button">BAR</button>
        <button class="button" id="qc-button" type="button">QC</button>
        <button class="button" id="row-button" type="button">ROW</button>

  <div class="content">

      <div class="modal-head">
        <span id="qc-title">qc</span>
        <div class="actions">

            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
              <rect x="3" y="14" width="4" height="6" />

              <rect x="17" y="4" width="4" height="16" />
            </svg>
          </button>
          <button class="icon-button" id="qc-copy" type="button" title="copy as TSV">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="12" height="12" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>

<script>
const ROW_H = 36;
const BUFFER = 12;
const FMT = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const head = document.getElementById("head");
const body = document.getElementById("body");
const scroller = document.getElementById("scroller");
const meta = document.getElementById("meta");
const barsSelect = document.getElementById("bars-select");
const viewSelect = document.getElementById("view-select");
const targetSelect = document.getElementById("target-select");

let manifest = null;
let allColumns = [], allRows = [];
let originalAllRows = [];
let filteredAllRows = [];
let dateFrom = "";
let dateTo = "";
let visibleColumns = [], visibleIdxs = [];
let currentTarget = "none";
let order = new Int32Array(0);
let sortCol = -1, sortDir = 0;
let headerCells = [];
let pool = [];
let renderedStart = -1, renderedEnd = -1;
let lastLoadMs = 0;
let colStats = new Map();
let normEnabled = false;
let rowMode = "bar";
let cutN = 5;

let activeFactories = [];
let activeSpec = [];
let factories = [];
let factoriesByName = new Map();
let factoryTags = {};
let refetchTimer = null;
let hoverCol = -1;

const _tagSaveTimers = {};

function formatTags(arr) {
  return (arr || []).map(t => `#${t}`).join(" ");
}

async function persistTags(factory, raw) {
  const parsed = String(raw || "")
    .split(/[\s,]+/)
    .map(s => s.replace(/^#+/, "").trim().toLowerCase())
    .filter(s => /^[a-z0-9][a-z0-9_-]*$/.test(s));
  const dedup = [];
  const seen = new Set();
  for (const t of parsed) if (!seen.has(t)) { seen.add(t); dedup.push(t); }
  factoryTags[factory] = dedup;
  try {
    await fetch("/save_tags", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({factory, tags: dedup}),
    });
  } catch {}
}

function scheduleTagSave(factory, value) {
  clearTimeout(_tagSaveTimers[factory]);
  _tagSaveTimers[factory] = setTimeout(() => persistTags(factory, value), 500);
}

function rebuildActiveSpec() {
  activeSpec = [];
  for (const g of activeFactories) {
    for (const ps of (g.paramSets || [])) {
      activeSpec.push({ factory: g.factory, params: { ...ps } });
    }
  }
}

function paramsLabel(params) {
  if (!params) return "";
  const keys = Object.keys(params);
  if (keys.length === 0) return "";
  return keys.map(k => `${k}=${params[k]}`).join(" ");
}

function chipSummary(g) {
  const parts = (g.paramSets || []).map(paramsLabel).filter(Boolean);
  return parts.join(" · ");
}

function setHoverCol(idx) {
  if (hoverCol === idx) return;
  if (hoverCol >= 0) {
    if (headerCells[hoverCol]) headerCells[hoverCol].classList.remove("col-hover");
    for (const row of pool) {
      if (row.children[hoverCol]) row.children[hoverCol].classList.remove("col-hover");
    }
  }
  hoverCol = idx;
  if (idx >= 0) {
    if (headerCells[idx]) headerCells[idx].classList.add("col-hover");
    for (const row of pool) {
      if (row.children[idx]) row.children[idx].classList.add("col-hover");
    }
  }
}

function computeColStats() {
  colStats = new Map();
  for (let i = 1; i < allColumns.length; i++) {
    const col = allColumns[i];
    let mn = Infinity, mx = -Infinity;
    for (const r of allRows) {
      const v = r[i];
      if (v === null || typeof v !== "number" || !Number.isFinite(v)) continue;
      if (v < mn) mn = v;
      if (v > mx) mx = v;
    }
    if (mn !== Infinity) colStats.set(col, { min: mn, max: mx });
  }
}

function normValue(v, col) {
  if (v === null || typeof v !== "number" || !Number.isFinite(v)) return v;
  const s = colStats.get(col);
  if (!s) return v;
  const range = s.max - s.min;
  if (range === 0) return 0;
  return 2 * (v - s.min) / range - 1;
}

function shouldNorm(col) {
  return normEnabled && col !== currentTarget && col !== "datetime";
}

function isTimeColumn(name) {
  return name === "datetime" || name === "bar_start_datetime" || name === "bar_end_datetime";
}

function timePrefixCount() {
  let n = 0;
  for (const c of visibleColumns) {
    if (isTimeColumn(c)) n++;
    else break;
  }
  return n;
}

function colLabel(idx) {
  const c = visibleColumns[idx];
  if (isTimeColumn(c)) return c;
  const off = timePrefixCount();
  const specIdx = idx - off;
  if (specIdx >= 0 && specIdx < activeSpec.length) {
    const s = activeSpec[specIdx];
    const params = paramsSummary(s);
    return params ? `${s.factory} ${params}` : s.factory;
  }
  return c;
}

function isBinaryCol(idx) {
  const c = visibleColumns[idx];
  if (isTimeColumn(c)) return false;
  const off = timePrefixCount();
  const specIdx = idx - off;
  if (specIdx >= 0 && specIdx < activeSpec.length) {
    if (activeSpec[specIdx].factory.startsWith("is_")) return true;
  }
  const stats = colStats.get(c);
  return !!(stats && stats.min === 0 && stats.max === 1);
}

function buildHeaderCells() {
  head.innerHTML = "";
  headerCells = [];
  visibleColumns.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "cell";
    const lbl = document.createElement("span");
    lbl.textContent = colLabel(i);
    const car = document.createElement("span");
    car.className = "caret";
    d.appendChild(lbl);
    d.appendChild(car);
    d.title = c;
    d.addEventListener("click", () => onSort(i));
    d.addEventListener("mouseenter", () => setHoverCol(i));
    head.appendChild(d);
    headerCells.push(d);
  });
}

function applySort() {
  if (sortCol < 0) {
    for (let i = 0; i < order.length; i++) order[i] = i;
    return;
  }
  const allIdx = visibleIdxs[sortCol];
  const dir = sortDir;
  const tmp = Array.from(order);
  tmp.sort((a, b) => {
    const va = allRows[a][allIdx], vb = allRows[b][allIdx];
    if (va === null && vb === null) return a - b;
    if (va === null) return 1;
    if (vb === null) return -1;
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return a - b;
  });
  for (let i = 0; i < tmp.length; i++) order[i] = tmp[i];
}

function updateHeaders() {
  headerCells.forEach((cell, i) => {
    const caret = cell.querySelector(".caret");
    if (i === sortCol && sortDir !== 0) {
      cell.classList.add("active");
      if (caret) caret.textContent = sortDir > 0 ? "▲" : "▼";
    } else {
      cell.classList.remove("active");
      if (caret) caret.textContent = "";
    }
  });
}

function onSort(col) {
  if (sortCol !== col) { sortCol = col; sortDir = 1; }
  else if (sortDir === 1) { sortDir = -1; }
  else { sortCol = -1; sortDir = 0; }
  applySort();
  updateHeaders();
  renderedStart = -1; renderedEnd = -1;
  render();
}

function render() {
  const scrollTop = body.scrollTop;
  const viewportH = body.clientHeight;
  const start = Math.max(0, Math.floor(scrollTop / ROW_H) - BUFFER);
  const end = Math.min(allRows.length, Math.ceil((scrollTop + viewportH) / ROW_H) + BUFFER);
  if (start === renderedStart && end === renderedEnd) return;
  renderedStart = start; renderedEnd = end;

  const need = end - start;
  while (pool.length < need) {
    const row = document.createElement("div");
    row.className = "row";
    for (let j = 0; j < visibleColumns.length; j++) {
      const c = document.createElement("div");
      c.className = "cell";
      const colIdx = j;
      c.addEventListener("mouseenter", () => setHoverCol(colIdx));
      row.appendChild(c);
    }
    scroller.appendChild(row);
    pool.push(row);
  }
  for (let i = need; i < pool.length; i++) pool[i].style.display = "none";

  const binaryFlags = visibleColumns.map((_, i) => isBinaryCol(i));

  for (let i = 0; i < need; i++) {
    const row = pool[i];
    row.style.display = "";
    row.style.transform = `translateY(${(start + i) * ROW_H}px)`;
    const r = allRows[order[start + i]];
    const cells = row.children;
    cells[0].textContent = r[visibleIdxs[0]];
    cells[0].className = "cell" + (hoverCol === 0 ? " col-hover" : "");
    for (let j = 1; j < visibleColumns.length; j++) {
      const col = visibleColumns[j];
      const raw = r[visibleIdxs[j]];
      const cell = cells[j];
      let cls = "cell";
      if (raw === null) {
        cell.textContent = "—";
        cls = "cell null";
      } else if (binaryFlags[j]) {
        cell.textContent = raw === 1 ? "●" : "";
        cls = raw === 1 ? "cell binary-on" : "cell";
      } else if (typeof raw === "number") {
        const v = shouldNorm(col) ? normValue(raw, col) : raw;
        cell.textContent = FMT.format(v);
        cls = v > 0 ? "cell pos" : v < 0 ? "cell neg" : "cell";
        const stats = colStats.get(col);
        if (stats && stats.max > stats.min) {
          const pct = ((raw - stats.min) / (stats.max - stats.min)) * 100;
          cell.style.setProperty("--bar-pct", pct.toFixed(1) + "%");
          cls += " has-bar";
        } else {
          cell.style.removeProperty("--bar-pct");
        }
      } else {
        cell.textContent = String(raw);
      }
      if (hoverCol === j) cls += " col-hover";
      cell.className = cls;
    }
  }
}

let _loadSeq = 0;

async function load() {
  const seq = ++_loadSeq;
  const bars = barsSelect.value;
  const target = targetSelect.value;
  meta.textContent = "loading…";
  const t0 = performance.now();
  const url = `/data?bars=${encodeURIComponent(bars)}`
    + `&target=${encodeURIComponent(target)}`
    + `&features=${encodeURIComponent(JSON.stringify(activeSpec))}`;
  let res;
  try {
    res = await fetch(url);
  } catch (e) {
    if (seq === _loadSeq) meta.textContent = `network error: ${e.message}`;
    return;
  }
  if (seq !== _loadSeq) return;
  if (!res.ok) {
    meta.textContent = `load failed: ${await res.text()}`;
    return;
  }
  let data;
  try {
    data = await res.json();
  } catch (e) {
    meta.textContent = `bad json: ${e.message}`;
    return;
  }
  if (seq !== _loadSeq) return;
  const t1 = performance.now();

  try {
    allColumns = data.columns;
    originalAllRows = data.rows;
    currentTarget = target;
    lastLoadMs = t1 - t0;

    applyDateFilter();
    applyRowGrouping();
    computeColStats();
    applyVisibility();
  } catch (e) {
    console.error("render failed", e, {
      cols: data && data.columns,
      activeSpec,
    });
    meta.textContent = `render failed: ${e.message}`;
  }
}

function scheduleRefetch() {
  clearTimeout(refetchTimer);
  refetchTimer = setTimeout(load, 300);
}

function applyVisibility() {
  visibleColumns = allColumns.slice();
  visibleIdxs = visibleColumns.map((_, i) => i);

  document.documentElement.style.setProperty("--cols", Math.max(visibleColumns.length - 1, 1));

  for (const r of pool) r.remove();
  pool = [];
  hoverCol = -1;

  buildHeaderCells();
  order = new Int32Array(allRows.length);
  for (let i = 0; i < allRows.length; i++) order[i] = i;
  if (rowMode === "bar") { sortCol = 0; sortDir = -1; }
  else { sortCol = -1; sortDir = 0; }
  applySort();
  updateHeaders();
  scroller.style.height = (allRows.length * ROW_H) + "px";
  body.scrollTop = 0;
  renderedStart = -1; renderedEnd = -1;

  const visCount = Math.max(visibleColumns.length - 1, 0);
  const totalCount = Math.max(allColumns.length - 1, 0);
  meta.innerHTML =
    `<b>${allRows.length.toLocaleString()}</b> rows · <b>${visCount}</b>/<b>${totalCount}</b> cols · <b>${lastLoadMs.toFixed(0)}</b> ms`;

  render();
}

const ROW_GROUPS = [
  { title: "dataset", options: [
    { id: "bar",     label: "bar" },
    { id: "all",     label: "all" },
  ]},
  { title: "time", options: [
    { id: "day",     label: "day" },
    { id: "week",    label: "week" },
    { id: "month",   label: "month" },
    { id: "quarter", label: "quarter" },
    { id: "year",    label: "year" },
  ]},
  { title: "period", options: [
    { id: "dow",     label: "day of week" },
    { id: "dom",     label: "day of month" },
    { id: "woy",     label: "week of year" },
  ]},
  { title: "statistical", options: [
    { id: "cut",      label: "cut", hasInput: true },
    { id: "quantile", label: "quantile" },
    { id: "decile",   label: "decile" },
  ]},
];
const STAT_MODES = new Set(["cut", "quantile", "decile"]);
const TIME_PERIOD_MODES = new Set([
  "day", "week", "month", "quarter", "year",
  "dow", "dom", "woy",
]);

function isDollarBar(barName) {
  return typeof barName === "string" && barName.endsWith("_dollar_bars");
}
const QUANTILE_PCTS = [0.01, 5, 25, 50, 75, 95, 99.9];

function median(values) {
  const xs = [];
  for (const v of values) if (v !== null && Number.isFinite(v)) xs.push(v);
  if (xs.length === 0) return null;
  xs.sort((a, b) => a - b);
  const m = xs.length / 2;
  return xs.length % 2 ? xs[Math.floor(m)] : (xs[m - 1] + xs[m]) / 2;
}

function isoWeek(date) {
  const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
  const dayNr = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNr + 3);
  const firstThu = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const firstDayNr = (firstThu.getUTCDay() + 6) % 7;
  firstThu.setUTCDate(firstThu.getUTCDate() - firstDayNr + 3);
  const week = 1 + Math.round((d - firstThu) / 604800000);
  return { year: d.getUTCFullYear(), week };
}

function bucketKey(row, mode) {
  const dt = row[0];
  if (mode === "all")     return "all";
  if (mode === "day")     return dt.slice(0, 10);
  if (mode === "month")   return dt.slice(0, 7);
  if (mode === "year")    return dt.slice(0, 4);
  if (mode === "quarter") {
    const m = parseInt(dt.slice(5, 7), 10);
    return `${dt.slice(0, 4)}-Q${Math.floor((m - 1) / 3) + 1}`;
  }
  const date = new Date(dt.replace(" ", "T") + "Z");
  if (mode === "week") {
    const w = isoWeek(date);
    return `${w.year}-W${String(w.week).padStart(2, "0")}`;
  }
  if (mode === "dow") return String(((date.getUTCDay() + 6) % 7) + 1);
  if (mode === "dom") return String(date.getUTCDate()).padStart(2, "0");
  if (mode === "woy") return String(isoWeek(date).week).padStart(2, "0");
  return dt;
}

function aggregateByBucket(rows, columns, mode) {
  const groups = new Map();
  for (const r of rows) {
    const k = bucketKey(r, mode);
    let g = groups.get(k);
    if (!g) { g = []; groups.set(k, g); }
    g.push(r);
  }
  const keys = Array.from(groups.keys()).sort();
  const out = [];
  for (const k of keys) {
    const grp = groups.get(k);
    const row = [k];
    for (let j = 1; j < columns.length; j++) {
      const vals = grp.map(r => r[j]);
      row.push(median(vals));
    }
    out.push(row);
  }
  return out;
}

function aggregateStatistical(rows, columns, kind, anchorIdx, n) {
  const anchorVals = [];
  for (const r of rows) {
    const v = r[anchorIdx];
    if (v !== null && Number.isFinite(v)) anchorVals.push(v);
  }
  if (anchorVals.length < 2) return [];
  const sorted = [...anchorVals].sort((a, b) => a - b);

  let cuts = [];
  let labels = [];

  if (kind === "decile") {
    for (let k = 1; k < 10; k++) cuts.push(sorted[Math.floor(k * sorted.length / 10)]);
    for (let i = 1; i <= 10; i++) labels.push(`d${String(i).padStart(2, "0")}`);
  } else if (kind === "quantile") {
    const centers = QUANTILE_PCTS.map(p => {
      const i = Math.min(Math.floor(p * sorted.length / 100), sorted.length - 1);
      return sorted[i];
    });
    for (let k = 0; k < centers.length - 1; k++) cuts.push((centers[k] + centers[k + 1]) / 2);
    labels = QUANTILE_PCTS.map(p => `p${p}`);
  } else if (kind === "cut") {
    const N = Math.max(2, Math.floor(n));
    const mn = sorted[0], mx = sorted[sorted.length - 1];
    if (mn === mx) return [];
    const w = (mx - mn) / N;
    for (let k = 1; k < N; k++) cuts.push(mn + k * w);
    for (let i = 0; i < N; i++) {
      const lo = mn + i * w, hi = mn + (i + 1) * w;
      labels.push(`[${lo.toFixed(2)},${hi.toFixed(2)})`);
    }
  } else {
    return [];
  }

  const binOf = (v) => {
    if (v === null || !Number.isFinite(v)) return -1;
    let i = 0;
    while (i < cuts.length && v >= cuts[i]) i++;
    return i;
  };

  const groups = labels.map(() => []);
  for (const r of rows) {
    const b = binOf(r[anchorIdx]);
    if (b >= 0) groups[b].push(r);
  }

  const out = [];
  for (let b = 0; b < labels.length; b++) {
    const grp = groups[b];
    const row = [labels[b]];
    for (let j = 1; j < columns.length; j++) {
      row.push(grp.length === 0 ? null : median(grp.map(r => r[j])));
    }
    out.push(row);
  }
  return out;
}

function determineAnchorIdx() {
  if (currentTarget !== "none") {
    const i = allColumns.indexOf(currentTarget);
    if (i >= 0) return i;
  }
  for (let i = 1; i < allColumns.length; i++) {
    const c = allColumns[i];
    if (isTimeColumn(c)) continue;
    if (c !== currentTarget) return i;
  }
  return 1;
}

function applyDateFilter() {
  if (!dateFrom && !dateTo) {
    filteredAllRows = originalAllRows;
    return;
  }
  const lo = dateFrom || "0000-01-01";
  const hi = dateTo || "9999-12-31";
  filteredAllRows = originalAllRows.filter(r => {
    const day = String(r[0]).slice(0, 10);
    return day >= lo && day <= hi;
  });
}

function applyRowGrouping() {
  if (rowMode === "bar") {
    allRows = filteredAllRows;
    return;
  }
  if (STAT_MODES.has(rowMode)) {
    allRows = aggregateStatistical(filteredAllRows, allColumns, rowMode, determineAnchorIdx(), cutN);
    return;
  }
  allRows = aggregateByBucket(filteredAllRows, allColumns, rowMode);
}

function applyAfterRowChange() {
  applyRowGrouping();
  computeColStats();
  applyVisibility();
}

function applyAfterDateChange() {
  applyDateFilter();
  applyRowGrouping();
  computeColStats();
  applyVisibility();
}

function fmtCell(v) {
  if (v === null || v === undefined) return { text: "—", cls: "num null" };
  if (typeof v === "string") return { text: v, cls: "" };
  if (typeof v === "number") {
    let text;
    if (Number.isInteger(v)) text = v.toString();
    else if (Math.abs(v) >= 1e6 || (v !== 0 && Math.abs(v) < 1e-3)) text = v.toExponential(2);
    else text = v.toFixed(4);
    const cls = v > 0 ? "num pos" : v < 0 ? "num neg" : "num";
    return { text, cls };
  }
  return { text: String(v), cls: "" };
}

const QC_META = {
  missing_rate:           {range: "<0.01 great",        tip: "Fraction of bar values missing. High values mean cold-start warmup or data gaps; <0.01 is healthy."},
  n_unique:               {range: "1=const, 2=binary",  tip: "Distinct non-NaN values. 1 = constant (drop); 2 = binary; 3-50 = clean categorical; large = continuous. Combined with row count to grade cardinality."},
  unique_fraction:        {range: ">0.9 continuous",    tip: "Distinct values / row count. Near 1.0 = continuous numeric; near 0 = constant or near-binary."},
  min:                    {range: "—",                  tip: "Minimum non-NaN value. Sanity-check scale and outliers."},
  max:                    {range: "—",                  tip: "Maximum non-NaN value. Sanity-check scale and outliers."},
  median:                 {range: "—",                  tip: "50th percentile. Robust central tendency."},
  p01:                    {range: "—",                  tip: "1st percentile. Lower-tail bound for the bulk of the distribution."},
  p99:                    {range: "—",                  tip: "99th percentile. Upper-tail bound for the bulk of the distribution."},
  skew:                   {range: "|s|<1 symmetric",    tip: "Distribution asymmetry. Heavy positive skew is normal for vol; large |skew| flags a log-transform candidate."},
  adf_p:                  {range: "<0.05 stationary",   tip: "Augmented Dickey–Fuller p-value. Low p rejects a unit root, i.e. the series is stationary."},
  kpss_p:                 {range: ">0.05 stationary",   tip: "KPSS p-value. High p fails to reject strict stationarity. Long-memory series often reject both ADF and KPSS — that's expected, not a defect."},
  acf_lag_1:              {range: ">0.5 persistent",    tip: "Autocorrelation at lag 1 bar. High = vol-clustering / momentum; near 0 = fast-mixing."},
  acf_lag_5:              {range: ">0.3 persistent",    tip: "Autocorrelation at lag 5 bars. Decay rate of short-horizon dependence."},
  acf_lag_24:             {range: ">0.2 daily cycle",   tip: "Autocorrelation at lag 24 bars. On 1h bars this is the daily-seasonal lag."},
  acf_lag_168:            {range: ">0.2 weekly cycle",  tip: "Autocorrelation at lag 168 bars. On 1h bars this is the weekly-seasonal lag."},
  block_size:             {range: "1–200 bars",         tip: "Lag at which |ACF| drops below 0.05; used as bootstrap block length for the Spearman CI. Cap is 200."},
  max_pairwise_spearman:  {range: "<0.3 unique",        tip: "Highest |Spearman| with any other feature in the set. >0.7 = essentially a duplicate; 0.3–0.7 = some overlap; <0.3 = uniquely shaped."},
  mean_pairwise_spearman: {range: "<0.3 mostly unique", tip: "Average |Spearman| across all other features. Catches diffuse redundancy that max misses."},
  redundancy_penalty:     {range: ">0.7 unique",        tip: "1 − max_pairwise_spearman. Pre-computed multiplier for uniqueness-adjusted edge."},
  max_pairwise_mi:        {range: "<0.1 independent",   tip: "Highest pairwise mutual information. Catches non-linear redundancy that Spearman misses."},
  spearman:               {range: "|ρ|>0.1 strong",     tip: "Rank correlation with target. ±0.05 = noise band; ±0.10+ = meaningful directional edge."},
  spearman_ci_lo:         {range: "—",                  tip: "Block-bootstrap 95% lower bound for spearman. If [lo, hi] crosses zero, the edge is not statistically significant."},
  spearman_ci_hi:         {range: "—",                  tip: "Block-bootstrap 95% upper bound for spearman. Use with lo to check significance."},
  mutual_information:     {range: ">0 has info",        tip: "Mutual information with target. Catches non-linear edge that Spearman misses."},
  decile_spread:          {range: "|d|>0.1 useful",     tip: "Mean target in top decile minus mean target in bottom decile. Sign + magnitude of the directional edge."},
  monotonic_fraction:     {range: ">0.7 monotone",      tip: "Fraction of consecutive feature deciles whose mean-target moves in the overall direction. >0.7 = clean monotone edge."},
  regime_sign_agreement:  {range: "4/4 stable",         tip: "Sign of spearman across 4 chronological quartiles. 4/4 = stable across regimes; 2/4 = sign-flipping; lower = unstable."},
  regime_spearman_std:    {range: "<0.05 stable",       tip: "Standard deviation of spearman across 4 time-quartiles. Lower = more regime-stable."},
};

let qcGradesOn = true;
let qcTip = null;

const QC_GROUPS = [
  {name: "HEALTH",       rows: ["missing_rate", "n_unique", "unique_fraction", "min", "max", "median", "p01", "p99", "skew"]},
  {name: "STATIONARITY", rows: ["adf_p", "kpss_p"]},
  {name: "REDUNDANCY",   rows: ["max_pairwise_spearman", "mean_pairwise_spearman", "redundancy_penalty", "max_pairwise_mi"]},
  {name: "EDGE",         rows: ["spearman", "spearman_ci_lo", "spearman_ci_hi", "mutual_information", "decile_spread", "monotonic_fraction"]},
  {name: "REGIME",       rows: ["regime_sign_agreement", "regime_spearman_std"]},
];
const QC_ROW_TO_GROUP = {};
for (const g of QC_GROUPS) for (const r of g.rows) QC_ROW_TO_GROUP[r] = g.name;
const GRADE_RANK = {D: 0, C: 1, O: 2, S: 3};
let qcGroupsExpanded = new Set();

function aggregateGroupGrade(groupRows, featureName, grades) {
  let worst = null;
  for (const rowName of groupRows) {
    const g = (grades[rowName] || {})[featureName];
    if (g == null) continue;
    if (worst === null || GRADE_RANK[g] < GRADE_RANK[worst]) worst = g;
  }
  return worst;
}
function ensureQcTip() {
  if (!qcTip) {
    qcTip = document.createElement("div");
    qcTip.className = "qc-tip";
    document.body.appendChild(qcTip);
  }
  return qcTip;
}
function showQcTip(td) {
  const tip = ensureQcTip();
  tip.textContent = td.dataset.tip || "";
  tip.classList.add("open");
  const r = td.getBoundingClientRect();
  const w = tip.offsetWidth;
  const h = tip.offsetHeight;
  let x = r.right + 8;
  if (x + w > window.innerWidth - 8) x = Math.max(8, r.left - w - 8);
  let y = r.top + (r.height - h) / 2;
  if (y < 8) y = 8;
  if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
}
function hideQcTip() { if (qcTip) qcTip.classList.remove("open"); }

function renderQc(report) {
  const tbl = document.createElement("table");
  tbl.className = "qc-table" + (qcGradesOn ? " with-grades" : "");
  const thead = document.createElement("thead");
  const trH = document.createElement("tr");
  for (const c of report.columns) {
    const th = document.createElement("th");
    th.textContent = c;
    th.title = c;
    trH.appendChild(th);
  }
  thead.appendChild(trH);
  tbl.appendChild(thead);
  const grades = report.grades || {};
  const targetCol = targetSelect.value !== "none" ? targetSelect.value : null;
  const tbody = document.createElement("tbody");

  const rowsByMetric = {};
  for (const row of report.rows) rowsByMetric[row[0]] = row;

  for (const group of QC_GROUPS) {
    const expanded = qcGroupsExpanded.has(group.name);
    const headerTr = document.createElement("tr");
    headerTr.className = "qc-group-row" + (expanded ? " expanded" : "");
    headerTr.dataset.group = group.name;
    for (let i = 0; i < report.columns.length; i++) {
      const td = document.createElement("td");
      if (i === 0) {
        const chev = document.createElement("span");
        chev.className = "chevron";
        chev.textContent = expanded ? "▼" : "▶";
        td.appendChild(chev);
        td.appendChild(document.createTextNode(group.name));
      } else {
        const featureName = report.columns[i];
        td.textContent = "";
        if (featureName === targetCol) {
          td.dataset.grade = "NA";
        } else {
          const agg = aggregateGroupGrade(group.rows, featureName, grades);
          if (agg) td.dataset.grade = agg;
        }
      }
      headerTr.appendChild(td);
    }
    headerTr.addEventListener("click", () => {
      if (qcGroupsExpanded.has(group.name)) qcGroupsExpanded.delete(group.name);
      else qcGroupsExpanded.add(group.name);
      renderQc(report);
    });
    tbody.appendChild(headerTr);

    if (!expanded) continue;
    for (const metric of group.rows) {
      const row = rowsByMetric[metric];
      if (!row) continue;
      const tr = document.createElement("tr");
      for (let i = 0; i < row.length; i++) {
        const td = document.createElement("td");
        if (i === 0) {
          td.textContent = row[i];
          const meta = QC_META[metric];
          if (meta && meta.tip) {
            td.dataset.tip = meta.tip;
            td.classList.add("has-tip");
          }
        } else {
          const { text, cls } = fmtCell(row[i]);
          td.textContent = text;
          td.className = cls;
          const featureName = report.columns[i];
          if (featureName === targetCol) {
            td.dataset.grade = "NA";
          } else {
            const g = grades[metric] && grades[metric][featureName];
            if (g) td.dataset.grade = g;
          }
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
  }

  tbody.addEventListener("mouseover", e => {
    const td = e.target.closest("td.has-tip");
    if (td) showQcTip(td);
  });
  tbody.addEventListener("mouseout", e => {
    if (e.target.closest("td.has-tip")) hideQcTip();
  });
  tbl.appendChild(tbody);
  qcBody.replaceChildren(tbl);
}

async function runQc() {
  const bars = barsSelect.value;
  const target = targetSelect.value;
  const colsForQc = visibleColumns.filter(c => c !== "datetime" && c !== currentTarget);
  const cols = colsForQc.join(",");
  qcTitle.textContent = `qc · ${bars} · ${target}`;
  qcBody.innerHTML = `<div class="qc-status">running quality control…</div>`;
  qcModal.classList.add("open");
  const t0 = performance.now();
  try {
    const url = `/qc?bars=${encodeURIComponent(bars)}`
      + `&target=${encodeURIComponent(target)}`
      + `&cols=${encodeURIComponent(cols)}`
      + `&features=${encodeURIComponent(JSON.stringify(activeSpec))}`;
    const res = await fetch(url);
    if (!res.ok) {
      const msg = await res.text();
      qcBody.innerHTML = `<div class="qc-status">qc failed: ${msg}</div>`;
      return;
    }
    const report = await res.json();
    qcReport = report;
    renderQc(report);
    const dt = performance.now() - t0;
    qcTitle.textContent = `qc · ${bars} · ${target}  ·  ${(dt/1000).toFixed(1)}s`;
  } catch (e) {
    qcBody.innerHTML = `<div class="qc-status">qc failed: ${e}</div>`;
  }
}

function formatCellForCopy(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "number") {
    if (Number.isInteger(v)) return String(v);
    if (Math.abs(v) >= 1e6 || (v !== 0 && Math.abs(v) < 1e-3)) return v.toExponential(4);
    return v.toFixed(6);
  }
  return String(v).replace(/\t/g, " ").replace(/[\r\n]+/g, " ");
}

async function copyQcAsTsv() {
  if (!qcReport) return;
  const cols = qcReport.columns;
  const lines = [cols.map(c => formatCellForCopy(c)).join("\t")];
  for (const row of qcReport.rows) {
    const cells = [];
    for (let i = 0; i < cols.length; i++) cells.push(formatCellForCopy(row[i]));
    lines.push(cells.join("\t"));
  }
  const text = lines.join("\n");
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch {
      ok = false;
    }
  }
  if (ok) {
    qcCopy.classList.add("copied");
    qcCopy.title = `copied ${qcReport.rows.length} rows × ${cols.length} cols`;
    setTimeout(() => qcCopy.classList.remove("copied"), 800);
  } else {
    qcCopy.title = "copy failed";
  }
}

function paramsSummary(spec) {
  const params = spec.params || {};

  if (keys.length === 0) return "";

}

function defaultParamsFor(name) {

function addFactory(name) {
  if (activeFactories.some(g => g.factory === name)) return;
  activeFactories.push({ factory: name, paramSets: [defaultParamsFor(name)] });
  rebuildActiveSpec();
  refreshFeaturesModal();
  scheduleRefetch();
}

function removeFactory(idx) {
  activeFactories.splice(idx, 1);
  if (openChipIdx === idx) openChipIdx = -1;
  else if (openChipIdx > idx) openChipIdx -= 1;
  rebuildActiveSpec();
  refreshFeaturesModal();
  scheduleRefetch();
}

function addParamSet(idx) {
  const g = activeFactories[idx];
  const meta = factoriesByName.get(g.factory);
  const params = (meta && meta.params) || [];
  const next = defaultParamsFor(g.factory);
  if (params.length > 0) {
    const isDup = () => g.paramSets.some(ps =>
      params.every(p => Number(ps[p.name]) === Number(next[p.name]))
    );
    if (isDup()) {
      const p = params[0];
      const max = Math.max(
        ...g.paramSets.map(ps => Number(ps[p.name])).filter(Number.isFinite),
        Number(next[p.name]) || 0
      );
      next[p.name] = max + 1;
    }
  }
  g.paramSets.push(next);
  rebuildActiveSpec();
  renderActivePane();
  scheduleRefetch();
}

function removeParamSet(factoryIdx, setIdx) {
  const g = activeFactories[factoryIdx];
  g.paramSets.splice(setIdx, 1);
  if (g.paramSets.length === 0) {
    removeFactory(factoryIdx);
    return;
  }
  rebuildActiveSpec();
  renderActivePane();
  scheduleRefetch();
}

function renderActivePane() {
  const list = document.getElementById("features-active-list");
  if (!list) return;
  const pane = list.parentElement;
  const prevScroll = pane ? pane.scrollTop : 0;
  list.replaceChildren();
  if (activeFactories.length === 0) {
    const empty = document.createElement("div");
    empty.className = "active-empty";
    empty.textContent = "drag factories from the left to compose your view";
    list.appendChild(empty);
    if (pane) pane.scrollTop = prevScroll;
    return;
  }
  activeFactories.forEach((g, idx) => {
    const meta = factoriesByName.get(g.factory);
    const hasParams = !!(meta && (meta.params || []).length > 0);

    const chip = document.createElement("div");
    chip.className = "active-chip" + (idx === openChipIdx ? " open" : "");
    chip.draggable = true;
    chip.addEventListener("dragstart", e => {
      e.dataTransfer.setData("text/active-chip-idx", String(idx));
      e.dataTransfer.effectAllowed = "move";
      chip.classList.add("dragging");
    });
    chip.addEventListener("dragend", () => chip.classList.remove("dragging"));
    chip.addEventListener("dragover", e => {
      if (!e.dataTransfer.types.includes("text/active-chip-idx")) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = "move";
      chip.classList.add("drop-target");
    });
    chip.addEventListener("dragleave", () => chip.classList.remove("drop-target"));
    chip.addEventListener("drop", e => {
      if (!e.dataTransfer.types.includes("text/active-chip-idx")) return;
      e.preventDefault();
      e.stopPropagation();
      chip.classList.remove("drop-target");
      const fromIdx = parseInt(e.dataTransfer.getData("text/active-chip-idx"), 10);
      if (!Number.isFinite(fromIdx) || fromIdx === idx) return;
      const item = activeFactories.splice(fromIdx, 1)[0];
      activeFactories.splice(idx, 0, item);
      if (openChipIdx === fromIdx) openChipIdx = idx;
      else if (fromIdx < openChipIdx && idx >= openChipIdx) openChipIdx -= 1;
      else if (fromIdx > openChipIdx && idx <= openChipIdx) openChipIdx += 1;
      rebuildActiveSpec();
      refreshFeaturesModal();
      scheduleRefetch();
    });

    const head = document.createElement("div");
    head.className = "active-chip-head";

    const name = document.createElement("span");
    name.className = "active-chip-name";
    name.textContent = g.factory;
    head.appendChild(name);

    const summary = document.createElement("span");
    summary.className = "active-chip-summary";
    summary.textContent = chipSummary(g);
    head.appendChild(summary);

    const remove = document.createElement("button");
    remove.className = "active-chip-remove";
    remove.type = "button";
    remove.textContent = "×";
    remove.title = "remove factory";
    remove.addEventListener("click", e => {
      e.stopPropagation();
      removeFactory(idx);
    });
    head.appendChild(remove);

    head.addEventListener("click", () => {
      openChipIdx = (openChipIdx === idx) ? -1 : idx;
      renderActivePane();
    });
    chip.appendChild(head);

    const paramsBox = document.createElement("div");
    paramsBox.className = "active-chip-params";

    if (hasParams) {
      g.paramSets.forEach((ps, sIdx) => {
        const psRow = document.createElement("div");
        psRow.className = "paramset-row";
        for (const p of meta.params) {
          const row = document.createElement("label");
          row.className = "param-row";
          const lbl = document.createElement("span");
          lbl.textContent = p.name;
          row.appendChild(lbl);
          const inp = document.createElement("input");
          inp.type = "number";
          if (p.min !== undefined) inp.min = String(p.min);
          if (p.type === "int") inp.step = "1";
          inp.value = String(ps[p.name] ?? p.default);
          inp.addEventListener("input", () => {
            let v = p.type === "int" ? parseInt(inp.value, 10) : parseFloat(inp.value);
            if (!Number.isFinite(v)) return;
            if (p.min !== undefined && v < p.min) v = p.min;
            ps[p.name] = v;
            summary.textContent = chipSummary(g);
            rebuildActiveSpec();
            scheduleRefetch();
          });
          row.appendChild(inp);
          psRow.appendChild(row);
        }
        const spacer = document.createElement("span");
        spacer.className = "spacer";
        psRow.appendChild(spacer);
        const removeSet = document.createElement("button");
        removeSet.className = "paramset-remove";
        removeSet.type = "button";
        removeSet.textContent = "−";
        removeSet.title = "remove this entry";
        removeSet.addEventListener("click", e => {
          e.stopPropagation();
          removeParamSet(idx, sIdx);
        });
        psRow.appendChild(removeSet);
        paramsBox.appendChild(psRow);
      });

      const addBtn = document.createElement("button");
      addBtn.className = "paramset-add";
      addBtn.type = "button";
      addBtn.textContent = "+ add";
      addBtn.addEventListener("click", e => {
        e.stopPropagation();
        addParamSet(idx);
      });
      paramsBox.appendChild(addBtn);
    }

    const tagsRow = document.createElement("div");
    tagsRow.className = "chip-tags";
    const tagsLbl = document.createElement("span");
    tagsLbl.className = "chip-tags-label";
    tagsLbl.textContent = "tags";
    tagsRow.appendChild(tagsLbl);
    const tagsInput = document.createElement("input");
    tagsInput.type = "text";
    tagsInput.className = "chip-tags-input";
    tagsInput.placeholder = "#volatility #intraday";
    tagsInput.value = formatTags(factoryTags[g.factory]);
    tagsInput.addEventListener("input", () => scheduleTagSave(g.factory, tagsInput.value));
    tagsInput.addEventListener("blur", () => persistTags(g.factory, tagsInput.value));
    tagsInput.addEventListener("click", e => e.stopPropagation());
    tagsRow.appendChild(tagsInput);
    paramsBox.appendChild(tagsRow);

    chip.appendChild(paramsBox);

    list.appendChild(chip);
  });
  if (pane) pane.scrollTop = prevScroll;
}

function openColModal() {
  const wrapper = document.createElement("div");
  wrapper.className = "features-builder";
  wrapper.appendChild(buildPalette());
  wrapper.appendChild(buildActivePane());
  colBody.replaceChildren(wrapper);
  renderActivePane();
  colModal.classList.add("open");
}

function closeCol() { colModal.classList.remove("open"); }

const saveButton = document.getElementById("save-button");

async function saveView() {
  if (activeSpec.length === 0) {
    alert("active set is empty; add at least one feature first");
    return;
  }
  const name = (prompt("save view as:") || "").trim().toLowerCase();
  if (!name) return;
  const res = await fetch("/save_view", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name, spec: activeSpec, target: targetSelect.value}),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok || !body.ok) {
    alert(`save failed: ${body.msg || res.statusText}`);
    return;
  }
  manifest = await (await fetch("/manifest")).json();
  factories = (manifest.factories || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  factoriesByName = new Map(factories.map(f => [f.name, f]));
  factoryTags = manifest.factory_tags || {};
  fillSelect(viewSelect, manifest.views);
  viewSelect.value = name;
  syncViewOptions();
}

const rowButton = document.getElementById("row-button");
const rowModal = document.getElementById("row-modal");
const rowBody = document.getElementById("row-body");
const rowClose = document.getElementById("row-close");

function openRowModal() {
  const container = document.createElement("div");
  container.className = "row-groups";
  const dollar = isDollarBar(barsSelect.value);
  for (const grp of ROW_GROUPS) {
    const sec = document.createElement("div");
    sec.className = "row-group";
    const hdr = document.createElement("div");
    hdr.className = "row-group-header";
    hdr.textContent = grp.title;
    sec.appendChild(hdr);
    const opts = document.createElement("div");
    opts.className = "row-options";
    const groupDisabled = dollar && (grp.title === "time" || grp.title === "period");
    for (const opt of grp.options) {
      const lbl = document.createElement("label");
      lbl.className = "row-option" + (groupDisabled ? " row-option-disabled" : "");
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "row-mode";
      input.value = opt.id;
      input.checked = (rowMode === opt.id);
      input.disabled = groupDisabled;
      input.addEventListener("change", () => {
        if (input.checked) {
          rowMode = opt.id;
          applyAfterRowChange();
        }
      });
      const span = document.createElement("span");
      span.textContent = opt.label;
      lbl.appendChild(input);
      lbl.appendChild(span);
      if (opt.hasInput) {
        const numIn = document.createElement("input");
        numIn.type = "number";
        numIn.className = "row-option-input";
        numIn.min = "2";
        numIn.step = "1";
        numIn.value = String(cutN);
        numIn.addEventListener("input", () => {
          const v = parseInt(numIn.value, 10);
          if (Number.isFinite(v) && v >= 2) {
            cutN = v;
            if (rowMode === "cut") applyAfterRowChange();
          }
        });
        numIn.addEventListener("click", e => e.preventDefault());
        lbl.appendChild(numIn);
      }
      opts.appendChild(lbl);
    }
    sec.appendChild(opts);
    container.appendChild(sec);
  }
  rowBody.replaceChildren(container);
  rowModal.classList.add("open");
}

function closeRow() { rowModal.classList.remove("open"); }

function loadSpecFromView(name) {
  const preset = (manifest.view_specs || {})[name] || [];
  const groups = new Map();
  for (const item of preset) {
    if (!groups.has(item.factory)) groups.set(item.factory, []);
    groups.get(item.factory).push(item.params ? { ...item.params } : {});
  }
  activeFactories = Array.from(groups, ([factory, paramSets]) => ({ factory, paramSets }));
  rebuildActiveSpec();
  openChipIdx = -1;
  const tgt = (manifest.view_targets || {})[name];
  if (tgt && Array.from(targetSelect.options).some(o => o.value === tgt)) {
    targetSelect.value = tgt;
  }
  if (colModal.classList.contains("open")) refreshFeaturesModal();
}

async function init() {
  manifest = await (await fetch("/manifest")).json();
  factories = (manifest.factories || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  factoriesByName = new Map(factories.map(f => [f.name, f]));
  factoryTags = manifest.factory_tags || {};
  fillSelect(barsSelect, manifest.bars);
  fillSelect(viewSelect, manifest.views);
  fillSelect(targetSelect, manifest.targets);
  barsSelect.value = "1h_time_bars";
  targetSelect.value = "none";
  syncViewOptions();
  loadSpecFromView(viewSelect.value);
  barsSelect.addEventListener("change", () => {
    if (isDollarBar(barsSelect.value) && TIME_PERIOD_MODES.has(rowMode)) {
      rowMode = "bar";
    }
    syncViewOptions();
    load();
  });
  viewSelect.addEventListener("change", () => {
    loadSpecFromView(viewSelect.value);
    load();
  });
  targetSelect.addEventListener("change", load);
  qcButton.addEventListener("click", runQc);
  qcClose.addEventListener("click", closeQc);
  qcCopy.addEventListener("click", copyQcAsTsv);
  const qcGradesBtn = document.getElementById("qc-grades");
  qcGradesBtn.classList.toggle("active", qcGradesOn);
  qcGradesBtn.addEventListener("click", () => {
    qcGradesOn = !qcGradesOn;
    qcGradesBtn.classList.toggle("active", qcGradesOn);
    const tbl = qcBody.querySelector(".qc-table");
    if (tbl) tbl.classList.toggle("with-grades", qcGradesOn);
  });
  qcModal.addEventListener("click", e => { if (e.target === qcModal) closeQc(); });
  colButton.addEventListener("click", openColModal);
  colClose.addEventListener("click", closeCol);
  colModal.addEventListener("click", e => { if (e.target === colModal) closeCol(); });
  saveButton.addEventListener("click", saveView);
  rowButton.addEventListener("click", openRowModal);
  rowClose.addEventListener("click", closeRow);
  rowModal.addEventListener("click", e => { if (e.target === rowModal) closeRow(); });
  const normButton = document.getElementById("norm-button");
  normButton.addEventListener("click", () => {
    normEnabled = !normEnabled;
    normButton.classList.toggle("active", normEnabled);
    renderedStart = -1; renderedEnd = -1;
    render();
  });
  const barButton = document.getElementById("bar-button");
  barButton.addEventListener("click", () => {
    body.classList.toggle("bars-on");
    barButton.classList.toggle("active", body.classList.contains("bars-on"));
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeQc(); closeCol(); closeRow(); }
  });
  body.addEventListener("scroll", render, { passive: true });
  body.addEventListener("mouseleave", () => setHoverCol(-1));
  head.addEventListener("mouseleave", () => setHoverCol(-1));
  window.addEventListener("resize", render);
  const dateFromInput = document.getElementById("date-from");
  const dateToInput = document.getElementById("date-to");
  const datePresets = document.getElementById("date-presets");
  const DATA_END = "2026-05-15";
  const PRESET_DAYS = { "1d": 1, "7d": 7, "1m": 30, "3m": 90, "1y": 365 };
  function shiftDate(s, days) {
    const d = new Date(s + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + days);
    return d.toISOString().slice(0, 10);
  }
  function setActivePreset(name) {
    for (const a of datePresets.querySelectorAll("a")) {
      a.classList.toggle("active", a.dataset.preset === name);
    }
  }
  dateFromInput.addEventListener("change", () => {
    dateFrom = dateFromInput.value;
    setActivePreset(null);
    applyAfterDateChange();
  });
  dateToInput.addEventListener("change", () => {
    dateTo = dateToInput.value;
    setActivePreset(null);
    applyAfterDateChange();
  });
  datePresets.addEventListener("click", e => {
    const a = e.target.closest("a[data-preset]");
    if (!a) return;
    const preset = a.dataset.preset;
    if (preset === "all") {
      dateFrom = "";
      dateTo = "";
    } else {
      dateFrom = shiftDate(DATA_END, -PRESET_DAYS[preset]);
      dateTo = DATA_END;
    }
    dateFromInput.value = dateFrom;
    dateToInput.value = dateTo;
    setActivePreset(preset);
    applyAfterDateChange();
  });
  await load();
}

init();
</script>
</body>
</html>
