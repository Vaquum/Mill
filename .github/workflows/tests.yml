name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[test]
      - run: python profiling/check_wheel.py
      - run: python profiling/prepare_limen_reference.py
      - run: env POLARS_MAX_THREADS=2 NUMBA_NUM_THREADS=2 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python profiling/check_limen.py --output /tmp/limen-compatibility.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: limen-compatibility-${{ github.run_attempt }}
          path: /tmp/limen-compatibility.json
          retention-days: 7
      - run: env POLARS_MAX_THREADS=2 NUMBA_NUM_THREADS=2 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python profiling/check.py
