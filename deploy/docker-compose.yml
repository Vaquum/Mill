services:
  mill:
    image: ${MILL_IMAGE:?MILL_IMAGE must be set}
    init: true
    environment:
      APP_USERNAME: ${APP_USERNAME:?APP_USERNAME must be set}
      APP_PASSWORD: ${APP_PASSWORD:?APP_PASSWORD must be set}
      API_SECRET: ${API_SECRET:?API_SECRET must be set}
      MILL_HOST: 0.0.0.0
      MILL_PORT: 8765
      MILL_CACHE_DIR: /data/experiments/mill/cache
      MILL_CONFIG_DIR: /data/experiments/mill/config
      MILL_ARROW_DIR: /opt/arrow
    ports:
      - "${MILL_PORT:-8765}:8765"
    volumes:
      - type: bind
        source: ${MILL_HOST_DATA_ROOT:-/data/experiments}
        target: /data/experiments
        read_only: false
      # The tdw Arrow bar store, mounted read-only so GetData can zero-copy
      # read /opt/arrow/<series>/latest.arrow via HistoricalData.get_arrow_file.
      # read_only:true means Mill can never write back into the shared store;
      # the volume is external (declared below), so this compose never creates
      # or deletes it.
      - type: volume
        source: arrow
        target: /opt/arrow
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  # External: the Arrow bar store volume is created and written by the
  # tdw-control-plane stack on the same host; Mill only references it.
  # external:true keeps this compose from creating or removing it, so a
  # teardown of the Mill project never touches the shared store.
  arrow:
    external: true
    name: ${ARROW_VOLUME_NAME:-tdw-control-plane_arrow}
